name: FTP probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP root and pwd
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "--- root listing"
          curl -sS --ssl-reqd --user "$U:$P" "ftp://$S/" -l
          echo "--- public_html listing"
          curl -sS --ssl-reqd --user "$U:$P" "ftp://$S/public_html/" -l || echo "no public_html under root"
